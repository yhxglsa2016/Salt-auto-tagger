name: 持续集成
run-name: 持续集成：${{ github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 运行测试并构建插件
        shell: pwsh
        run: .\gradlew.bat test plugin
